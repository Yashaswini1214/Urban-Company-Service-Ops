name: Build Part A-B artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependency
        run: python -m pip install --upgrade openpyxl

      - name: Generate deterministic seed and final artifacts
        run: python generate_data.py && python build_artifacts.py && python sanity_check.py

      - name: Commit generated data/database/workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urban_service.db partners_import.csv bookings.csv city_category_summary.csv urban_service_ops_kpi_workbook.xlsx
          git diff --cached --quiet || git commit -m "Build deterministic Part A-B artifacts"
          git push
